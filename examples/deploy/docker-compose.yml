version: '3.8'

services:
  stealthmark-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stealthmark-api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - STEALTHMARK_PORT=8000
      - STEALTHMARK_HOST=0.0.0.0
      - STEALTHMARK_FILE_DIR=/app/static/file
      - STEALTHMARK_RETENTION_DAYS=90
    volumes:
      - stealthmark-data:/app/static/file
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - stealthmark-net

  nginx:
    image: nginx:alpine
    container_name: stealthmark-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./examples/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./examples/deploy/certs:/etc/ssl/certs/stealthmark:ro
      - stealthmark-data:/app/static/file:ro
    depends_on:
      stealthmark-api:
        condition: service_healthy
    networks:
      - stealthmark-net

  certbot:
    image: certbot/certbot
    container_name: stealthmark-certbot
    volumes:
      - ./examples/deploy/certs:/etc/letsencrypt
      - ./examples/deploy/certs-challenge:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 604800 & wait $$!; certbot renew; done'"
    networks:
      - stealthmark-net

volumes:
  stealthmark-data:

networks:
  stealthmark-net:
    driver: bridge
