# StealthMark HTTPS 部署配置 - nginx
# 用 certbot（Let's Encrypt）自动管理证书
# 复制到 /etc/nginx/sites-available/stealthmark

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # === TLS 证书（certbot 自动写入） ===
    ssl_certificate     /etc/ssl/certs/stealthmark/fullchain.pem;
    ssl_certificate_key /etc/ssl/certs/stealthmark/privkey.pem;
    # Fallback for Let's Encrypt default path
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # === 安全头 ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # === 上传限制 ===
    client_max_body_size 200M;

    # === 超时配置 ===
    client_body_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://stealthmark-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    # 静态文件（StealthMark 已上传文件）直接服务
    location /static/ {
        alias /app/static/file/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}