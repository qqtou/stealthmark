# StealthMark Docker Compose 部署配置
# 包含 API 服务 + Nginx 反向代理，一键启动完整 HTTPS 部署
# 使用方式：docker-compose up -d

version: '3.8'

services:
  # =============================================
  # StealthMark API 服务
  # 基于 Dockerfile 多阶段构建，仅包含 API 所需依赖
  # =============================================
  stealthmark-api:
    build:
      context: .              # 构建上下文：项目根目录
      dockerfile: Dockerfile   # Dockerfile 路径
    container_name: stealthmark-api
    restart: unless-stopped    # 崩溃/重启后自动恢复（手动 stop 除外）
    expose:
      - "8000"                # 仅在 Docker 内部网络暴露，不直接映射到宿主机
    environment:
      # API 监听配置（覆盖 config.ini）
      - STEALTHMARK_PORT=8000             # 内部监听端口
      - STEALTHMARK_HOST=0.0.0.0          # 监听所有网卡（Docker 需要外部访问）
      # 文件存储配置
      - STEALTHMARK_FILE_DIR=/app/static/file   # 上传文件存储目录
      - STEALTHMARK_RETENTION_DAYS=90           # 文件保留天数
    volumes:
      # 持久化存储：上传文件保存在命名卷中，容器重建不丢失
      - stealthmark-data:/app/static/file
    healthcheck:
      # 健康检查：确认 API 服务正常运行
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s            # 每 30 秒检查一次
      timeout: 10s             # 超时 10 秒视为失败
      retries: 3               # 连续失败 3 次标记为 unhealthy
      start_period: 15s        # 启动后等待 15 秒再开始检查
    networks:
      - stealthmark-net        # 连接到内部网络（与 nginx 互通）

  # =============================================
  # Nginx 反向代理
  # 负责 TLS 终止、静态文件服务和负载均衡
  # =============================================
  nginx:
    image: nginx:alpine        # 轻量级 Nginx 镜像
    container_name: stealthmark-nginx
    restart: unless-stopped
    ports:
      - "80:80"                # HTTP → 重定向到 HTTPS
      - "443:443"              # HTTPS → 代理到 API 服务
    volumes:
      # 挂载 Nginx 配置文件（只读）
      - ./examples/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 挂载 TLS 证书目录（只读）
      - ./examples/deploy/certs:/etc/ssl/certs/stealthmark:ro
      # 挂载 API 上传文件（只读，用于静态文件直接服务）
      - stealthmark-data:/app/static/file:ro
    depends_on:
      stealthmark-api:
        condition: service_healthy  # 等 API 健康检查通过后再启动 Nginx
    networks:
      - stealthmark-net

# =============================================
# 命名卷：持久化上传文件
# 数据独立于容器生命周期，docker-compose down -v 才会删除
# =============================================
volumes:
  stealthmark-data:

# =============================================
# 自定义网络：容器间通信
# 使用 bridge 驱动，容器通过服务名互相访问（如 http://stealthmark-api:8000）
# =============================================
networks:
  stealthmark-net:
    driver: bridge
